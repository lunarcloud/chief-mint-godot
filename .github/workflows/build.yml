name: Build Project

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Godot Project
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: 4.3.0
        use-dotnet: false
        
    - name: Verify Godot Installation
      run: |
        godot --version
        
    - name: Import Project Assets
      run: |
        echo "Importing project assets..."
        godot --headless --verbose --import --quit
        echo "Import completed successfully"
        
    - name: Build Project
      run: |
        echo "Building/validating project..."
        godot --headless --verbose --quit
        echo "Project build validation completed successfully"
